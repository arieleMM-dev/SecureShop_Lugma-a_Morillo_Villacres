$kind: http-example
request:
  url: "{{base_url}}/users"
  method: POST
  headers:
    Authorization: Bearer {{access_token}}
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "cedula": "1712345678",
        "nombres": "Pedro Andrés",
        "apellidos": "Salazar Torres",
        "fechaNacimiento": "1993-04-18",
        "username": "psalazar",
        "email": "psalazar@example.com",
        "telefono": "0987654321",
        "password": "{{new_user_password}}",
        "estado": true
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "87d1619e-af9e-4f57-84f2-f93f04690812",
        "cedula": "1799999001",
        "nombres": "Cuenta",
        "apellidos": "Demostracion",
        "fechaNacimiento": "1998-04-18",
        "username": "amendoza",
        "email": "analista@example.com",
        "telefono": "0990009001",
        "estado": true
      }
order: 1000
