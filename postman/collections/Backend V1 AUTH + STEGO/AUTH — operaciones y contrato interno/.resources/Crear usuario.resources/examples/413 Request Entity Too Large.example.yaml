$kind: http-example
request:
  url: "{{base_url}}/users"
  method: POST
  headers:
    Authorization: Bearer {{access_token}}
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "cedula": "1712345678",
        "nombres": "Pedro Andrés",
        "apellidos": "Salazar Torres",
        "fechaNacimiento": "1993-04-18",
        "username": "psalazar",
        "email": "psalazar@example.com",
        "telefono": "0987654321",
        "password": "{{new_user_password}}",
        "estado": true
      }
response:
  statusCode: 413
  statusText: Request Entity Too Large
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "statusCode": 413,
        "message": "Carga excesiva",
        "timestamp": "2026-11-04T12:00:00.000Z",
        "path": "/api/v1/users",
        "requestId": "ejemplo-auth"
      }
order: 6000
