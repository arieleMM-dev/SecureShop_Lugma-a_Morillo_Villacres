$kind: http-example
request:
  url: "{{base_url}}/auth/login"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "identifier": "amendoza",
        "password": "{{seed_password}}"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "statusCode": 400,
        "message": [
          "Entrada o parámetro inválido"
        ],
        "timestamp": "2026-11-04T12:00:00.000Z",
        "path": "/api/v1/auth/login",
        "requestId": "ejemplo-auth"
      }
order: 2000
