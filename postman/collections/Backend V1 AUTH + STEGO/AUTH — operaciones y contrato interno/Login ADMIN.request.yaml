$kind: http-request
url: "{{base_url}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "identifier": "jperez",
      "password": "{{seed_password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Login correcto', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) pm.collectionVariables.set('access_token', pm.response.json().accessToken);
    language: text/javascript
order: 2000
examples: ./.resources/Login ADMIN.resources/examples
