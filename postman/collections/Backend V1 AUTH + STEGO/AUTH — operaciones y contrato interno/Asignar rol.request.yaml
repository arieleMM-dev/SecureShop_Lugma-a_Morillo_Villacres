$kind: http-request
url: "{{base_url}}/user-roles"
method: POST
headers:
  Authorization: Bearer {{access_token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "userId": "{{user_id}}",
      "roleId": "{{role_id}}"
    }
order: 16000
examples: ./.resources/Asignar rol.resources/examples
