$kind: http-request
url: "{{base_url}}/roles"
method: POST
headers:
  Authorization: Bearer {{access_token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "rol": "SUPERVISOR",
      "description": "Rol de ejemplo sin permisos de análisis",
      "estado": true
    }
order: 11000
examples: ./.resources/Crear rol.resources/examples
