$kind: http-example
request:
  url: "{{stego_url}}/api/v1/steganography/results/{{analysis_id}}"
  method: GET
  headers:
    Authorization: Bearer {{analyst_token}}
response:
  statusCode: 503
  statusText: Service Unavailable
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "detail": "No se pudo comprobar la autorización vigente"
      }
order: 8000
