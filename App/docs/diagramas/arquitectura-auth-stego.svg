<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
<title id="t">Arquitectura del Backend V1</title><desc id="d">Postman llama a dos contenedores autónomos. STEGO pide autorización vigente a AUTH mediante TLS. Los servicios tienen persistencias separadas.</desc>
<rect x="0" y="0" width="1200" height="720" rx="0" fill="#f5f8fc" stroke="#f5f8fc" stroke-width="1.5"/>
<text x="42" y="54" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#15243b">Arquitectura del Backend V1</text>
<text x="42" y="86" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#465b72">Dos APIs REST independientes con persistencias separadas</text>
<rect x="42" y="111" width="1116" height="102" rx="15" fill="#ffffff" stroke="#a6b9ca" stroke-width="1.5" stroke-dasharray="7 6"/>
<text x="65" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#226d9b">CLIENTE EXTERNO</text>
<text x="65" y="179" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#15243b">Postman / cliente REST local</text>
<text x="470" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#465b72">El JWT emitido por AUTH se envía a STEGO como Bearer.</text>
<rect x="42" y="279" width="1116" height="214" rx="15" fill="#eaf2f8" stroke="#99b6cc" stroke-width="1.5" stroke-dasharray="7 6"/>
<text x="420" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#226d9b">RED DE SERVICIOS  /  backend-services</text>
<rect x="70" y="334" width="400" height="124" rx="15" fill="#ffffff" stroke="#77a9c8" stroke-width="1.5"/>
<text x="90" y="367" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#226d9b">AUTH  ·  NestJS</text>
<text x="90" y="399" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#15243b">Identidades, JWT, roles y decisión vigente</text>
<text x="90" y="428" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#465b72">HTTPS local 3443</text>
<rect x="730" y="334" width="400" height="124" rx="15" fill="#ffffff" stroke="#76b5ae" stroke-width="1.5"/>
<text x="750" y="367" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#087d72">STEGO  ·  FastAPI</text>
<text x="750" y="399" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#15243b">Valida JWT y PNG, analiza LSB y registra</text>
<text x="750" y="428" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#465b72">HTTP local 8000</text>
