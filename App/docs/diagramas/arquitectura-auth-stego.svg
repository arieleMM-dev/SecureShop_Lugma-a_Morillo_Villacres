<polygon points="730,425 718,419 718,431" fill="#6044a2"/>
<text x="485" y="367" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#6044a2">TLS 1.3 + credencial + JWT</text>
<text x="495" y="414" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#6044a2">Decisión por acción y recurso</text>
<rect x="42" y="555" width="500" height="125" rx="15" fill="#ffffff" stroke="#99b6cc" stroke-width="1.5" stroke-dasharray="7 6"/>
<text x="66" y="584" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#226d9b">RED PRIVADA  /  auth-data</text>
<text x="66" y="617" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#15243b">PostgreSQL + volumen de AUTH</text>
<text x="66" y="648" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#465b72">users, roles, user_roles y auditoría</text>
<rect x="658" y="555" width="500" height="125" rx="15" fill="#ffffff" stroke="#76b5ae" stroke-width="1.5" stroke-dasharray="7 6"/>
<text x="682" y="584" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#087d72">VOLUMEN EXCLUSIVO DE STEGO</text>
<text x="682" y="617" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#15243b">SQLite + cuarentena privada</text>
<text x="682" y="648" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#465b72">Resultados, archivos retenidos y auditoría</text>
