<polygon points="270,334 276,322 264,322" fill="#226d9b"/>
<polyline points="930,213 930,334" fill="none" stroke="#087d72" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="930,334 936,322 924,322" fill="#087d72"/>
<text x="285" y="251" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#226d9b">HTTPS / login y administración</text>
<text x="945" y="251" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#087d72">Bearer + PNG</text>
<polyline points="730,380 470,380" fill="none" stroke="#6044a2" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="470,380 482,386 482,374" fill="#6044a2"/>
