services:

  postgres:
    image: postgres:18-alpine
    container_name: users-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: "${DB_DATABASE:?DB_DATABASE no definido}"
      POSTGRES_USER: "${DB_USERNAME:?DB_USERNAME no definido}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD no definido}"

    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"

    volumes:
      - users_postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    security_opt:
      - no-new-privileges:true

    networks:
      - users-network


volumes:
  users_postgres_data:


networks:
  users-network:
    driver: bridge